[package]
name = "ghost"
version = "0.1.0"
description = "Ghost — Custom Browser Shell"
authors = ["paul"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
