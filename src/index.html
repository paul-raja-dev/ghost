<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar">
    <!-- Row 1: Nav + URL bar -->
    <div id="navbar">
      <button class="nav-btn" id="back" title="Back">&#8592;</button>
      <button class="nav-btn" id="forward" title="Forward">&#8594;</button>
      <button class="nav-btn" id="reload-btn" title="Reload">&#8635;</button>
      <div id="urlbar-container">
        <input id="urlbar" type="text" placeholder="Search or enter address…" autocomplete="off" spellcheck="false" />
        <button id="star-btn" title="Bookmark page (Ctrl+D)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
      </div>
      <button class="nav-btn" id="history-btn" title="History (Ctrl+H)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
      <button class="nav-btn" id="bookmarks-btn" title="Bookmarks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="nav-btn" id="settings-btn" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
    <!-- Row 2: Tab strip -->
    <div id="tabbar">
      <button id="new-tab-btn" title="New Tab (Ctrl+T)">+</button>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const tabbar       = document.getElementById('tabbar');
    const newTabBtn    = document.getElementById('new-tab-btn');
    const urlbar       = document.getElementById('urlbar');
    const backBtn      = document.getElementById('back');
    const fwdBtn       = document.getElementById('forward');
    const reloadBtn    = document.getElementById('reload-btn');
    const starBtn      = document.getElementById('star-btn');
    const historyBtn   = document.getElementById('history-btn');
    const bookmarksBtn = document.getElementById('bookmarks-btn');
    const settingsBtn  = document.getElementById('settings-btn');

    let currentTabs     = [];
    let currentActiveId = null;

    function formatTabTitle(tab) {
      if (tab.title && !tab.title.startsWith('Tab ')) return tab.title;
      if (tab.url && tab.url.includes('newtab.html')) return 'new tab';
      try {
        const u = new URL(tab.url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return tab.url || 'new tab';
      }
    }

    function renderTabs() {
      tabbar.querySelectorAll('.tab').forEach(t => t.remove());
      currentTabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = `tab${tab.id === currentActiveId ? ' active' : ''}`;

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = formatTabTitle(tab);
        el.appendChild(title);

        const close = document.createElement('span');
        close.className = 'tab-close';
        close.textContent = '×';
        close.addEventListener('click', e => {
          e.stopPropagation();
          invoke('close_tab', { tabId: tab.id }).catch(console.error);
        });
        el.appendChild(close);

        el.addEventListener('click', () => {
          if (tab.id !== currentActiveId)
            invoke('switch_tab', { tabId: tab.id }).catch(console.error);
        });

        tabbar.insertBefore(el, newTabBtn);
      });
    }

    // Nav buttons
    backBtn.addEventListener('click',   () => invoke('go_back').catch(console.error));
    fwdBtn.addEventListener('click',    () => invoke('go_forward').catch(console.error));
    reloadBtn.addEventListener('click', () => invoke('reload').catch(console.error));

    starBtn.addEventListener('click', () => {
      invoke('toggle_bookmark_active_tab')
        .then(isBookmarked => {
          starBtn.classList.toggle('bookmarked', !!isBookmarked);
        })
        .catch(console.error);
    });

    historyBtn.addEventListener('click', () => invoke('create_tab', { url: 'history.html' }).catch(console.error));
    bookmarksBtn.addEventListener('click', () => invoke('create_tab', { url: 'bookmarks.html' }).catch(console.error));
    settingsBtn.addEventListener('click', () => invoke('create_tab', { url: 'settings.html' }).catch(console.error));

    function checkBookmarkState(url) {
      if (!url || url.includes('newtab.html') || url.includes('history.html') || url.includes('bookmarks.html') || url.includes('settings.html')) {
        starBtn.classList.remove('bookmarked');
        return;
      }
      invoke('is_bookmarked', { url })
        .then(isBookmarked => {
          starBtn.classList.toggle('bookmarked', !!isBookmarked);
        })
        .catch(() => starBtn.classList.remove('bookmarked'));
    }

    // URL bar navigation
    urlbar.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const input = urlbar.value.trim();
        if (input) invoke('navigate', { url: input }).catch(console.error);
      }
      if (e.key === 'Escape') urlbar.blur();
    });

    // New tab
    newTabBtn.addEventListener('click', () =>
      invoke('create_tab', { url: null }).catch(console.error));

    // Events from backend
    listen('tabs-changed', event => {
      currentTabs     = event.payload.tabs     || [];
      currentActiveId = event.payload.active_id || null;
      renderTabs();
    });

    listen('url-changed', event => {
      const url = event.payload || '';
      urlbar.value = (url.includes('newtab.html') || url.includes('history.html') || url.includes('bookmarks.html') || url.includes('settings.html')) ? '' : url;
      checkBookmarkState(url);
    });

    listen('toolbar-shown', () => {
      urlbar.focus();
      urlbar.select();
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', e => {
      const ctrl = e.ctrlKey || e.metaKey;
      const shift = e.shiftKey;
      const alt = e.altKey;
      const k = e.key ? e.key.toLowerCase() : '';

      if (ctrl && !shift && k === 't') {
        e.preventDefault(); invoke('create_tab', { url: null }).catch(console.error);
      } else if (ctrl && shift && k === 't') {
        e.preventDefault(); invoke('reopen_closed_tab').catch(console.error);
      } else if (ctrl && !shift && k === 'd') {
        e.preventDefault(); invoke('toggle_bookmark_active_tab').catch(console.error);
      } else if (ctrl && !shift && k === 'h') {
        e.preventDefault(); invoke('create_tab', { url: 'history.html' }).catch(console.error);
      } else if ((ctrl && !shift && k === 'w') || (ctrl && e.key === 'F4')) {
        e.preventDefault(); invoke('close_active_tab').catch(console.error);
      } else if ((ctrl && shift && k === 'tab') || (ctrl && e.key === 'PageUp')) {
        e.preventDefault(); invoke('prev_tab').catch(console.error);
      } else if ((ctrl && !shift && k === 'tab') || (ctrl && e.key === 'PageDown')) {
        e.preventDefault(); invoke('next_tab').catch(console.error);
      } else if (ctrl && !shift && k >= '1' && k <= '8') {
        e.preventDefault(); invoke('switch_tab_by_index', { index: parseInt(k) - 1 }).catch(console.error);
      } else if (ctrl && !shift && k === '9') {
        e.preventDefault(); invoke('switch_tab_by_index', { index: 999 }).catch(console.error);
      } else if ((ctrl && !shift && (k === 'l' || k === 'b')) || (alt && k === 'd') || e.key === 'F6') {
        e.preventDefault(); urlbar.focus(); urlbar.select();
      } else if ((ctrl && k === 'r') || e.key === 'F5') {
        e.preventDefault(); invoke('reload').catch(console.error);
      } else if (alt && (k === 'arrowleft' || k === 'left')) {
        e.preventDefault(); invoke('go_back').catch(console.error);
      } else if (alt && (k === 'arrowright' || k === 'right')) {
        e.preventDefault(); invoke('go_forward').catch(console.error);
      } else if (e.key === 'F12' || (ctrl && shift && k === 'i')) {
        e.preventDefault(); invoke('toggle_devtools').catch(console.error);
      }
    });
  </script>
</body>
</html>
