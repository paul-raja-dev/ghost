<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar">
    <!-- Row 1: Nav + URL bar -->
    <div id="navbar">
      <button class="nav-btn" id="back" title="Back">&#8592;</button>
      <button class="nav-btn" id="forward" title="Forward">&#8594;</button>
      <button class="nav-btn" id="reload-btn" title="Reload">&#8635;</button>
      <div id="urlbar-container">
        <input id="urlbar" type="text" placeholder="Search or enter address…" autocomplete="off" spellcheck="false" />
      </div>
    </div>
    <!-- Row 2: Tab strip -->
    <div id="tabbar">
      <button id="new-tab-btn" title="New Tab (Ctrl+T)">+</button>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const tabbar    = document.getElementById('tabbar');
    const newTabBtn = document.getElementById('new-tab-btn');
    const urlbar    = document.getElementById('urlbar');
    const backBtn   = document.getElementById('back');
    const fwdBtn    = document.getElementById('forward');
    const reloadBtn = document.getElementById('reload-btn');

    let currentTabs     = [];
    let currentActiveId = null;

    function formatTabTitle(tab) {
      if (tab.title && !tab.title.startsWith('Tab ')) return tab.title;
      if (tab.url && tab.url.includes('newtab.html')) return 'new tab';
      try {
        const u = new URL(tab.url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return tab.url || 'new tab';
      }
    }

    function renderTabs() {
      tabbar.querySelectorAll('.tab').forEach(t => t.remove());
      currentTabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = `tab${tab.id === currentActiveId ? ' active' : ''}`;

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = formatTabTitle(tab);
        el.appendChild(title);

        const close = document.createElement('span');
        close.className = 'tab-close';
        close.textContent = '×';
        close.addEventListener('click', e => {
          e.stopPropagation();
          invoke('close_tab', { tabId: tab.id }).catch(console.error);
        });
        el.appendChild(close);

        el.addEventListener('click', () => {
          if (tab.id !== currentActiveId)
            invoke('switch_tab', { tabId: tab.id }).catch(console.error);
        });

        tabbar.insertBefore(el, newTabBtn);
      });
    }

    // Nav buttons
    backBtn.addEventListener('click',   () => invoke('go_back').catch(console.error));
    fwdBtn.addEventListener('click',    () => invoke('go_forward').catch(console.error));
    reloadBtn.addEventListener('click', () => invoke('reload').catch(console.error));

    // URL bar navigation
    urlbar.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const input = urlbar.value.trim();
        if (input) invoke('navigate', { url: input }).catch(console.error);
      }
      if (e.key === 'Escape') urlbar.blur();
    });

    // New tab
    newTabBtn.addEventListener('click', () =>
      invoke('create_tab', { url: null }).catch(console.error));

    // Events from backend
    listen('tabs-changed', event => {
      currentTabs     = event.payload.tabs     || [];
      currentActiveId = event.payload.active_id || null;
      renderTabs();
    });

    listen('url-changed', event => {
      const url = event.payload || '';
      urlbar.value = url.includes('newtab.html') ? '' : url;
    });

    listen('toolbar-shown', () => {
      urlbar.focus();
      urlbar.select();
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && k === 'i')) {
        e.preventDefault(); invoke('toggle_devtools').catch(console.error);
      } else if (e.key === 'F5' || (e.ctrlKey && k === 'r')) {
        e.preventDefault(); invoke('reload').catch(console.error);
      } else if (e.ctrlKey && k === 'l') {
        e.preventDefault(); urlbar.focus(); urlbar.select();
      } else if (e.ctrlKey && k === 't') {
        e.preventDefault(); invoke('create_tab', { url: null }).catch(console.error);
      } else if (e.ctrlKey && k === 'w') {
        e.preventDefault();
        if (currentActiveId) invoke('close_tab', { tabId: currentActiveId }).catch(console.error);
      }
    });
  </script>
</body>
</html>
