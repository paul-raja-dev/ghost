<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 76px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #12121e;
      color: #e2e2f0;
      user-select: none;
    }
    #toolbar {
      display: flex;
      flex-direction: column;
      height: 76px;
      background: #12121e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* --- Row 1: Nav & Search Bar (42px) --- */
    #navbar {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 0 10px;
      gap: 8px;
      background: #0e0e18;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #9595b8;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .nav-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Search/URL Container */
    #urlbar-container {
      flex: 1;
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: #181828;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    #urlbar-container:focus-within {
      border-color: rgba(140, 140, 255, 0.55);
      background: #1f1f34;
      box-shadow: 0 0 0 2px rgba(140, 140, 255, 0.15);
    }
    #urlbar-icon {
      font-size: 12px;
      color: #757598;
      margin-right: 8px;
      flex-shrink: 0;
    }
    #urlbar {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: #f0f0ff;
      font-size: 13px;
      font-weight: 400;
      outline: none;
      min-width: 0;
    }
    #urlbar::placeholder {
      color: #606085;
    }
    #urlbar-container.loading {
      border-color: rgba(80, 200, 255, 0.65);
    }

    /* --- Row 2: Tab Strip (34px) Below Search Bar --- */
    #tabbar {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 8px;
      gap: 4px;
      background: #12121e;
      overflow-x: auto;
    }
    #tabbar::-webkit-scrollbar {
      display: none;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #8888aa;
      font-size: 12px;
      cursor: pointer;
      max-width: 180px;
      min-width: 100px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tab:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #d0d0e8;
    }
    .tab.active {
      background: #202034;
      border-color: rgba(140, 140, 255, 0.25);
      color: #ffffff;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 11px;
      color: #757598;
      transition: background 0.15s, color 0.15s;
    }
    .tab-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    #new-tab-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      color: #8888aa;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    #new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <!-- Row 1: Nav Bar & Search Bar (Top) -->
    <div id="navbar">
      <button class="nav-btn" id="back" title="Back">←</button>
      <button class="nav-btn" id="forward" title="Forward">→</button>
      <button class="nav-btn" id="refresh" title="Reload">↻</button>
      
      <div id="urlbar-container">
        <span id="urlbar-icon">🔒</span>
        <input id="urlbar" type="text" placeholder="Search with Google or enter URL..." />
      </div>
    </div>

    <!-- Row 2: Tab Bar (Tabs Below Search Bar) -->
    <div id="tabbar">
      <!-- Tabs injected dynamically -->
      <button id="new-tab-btn" title="New Tab (Ctrl+T)">+</button>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const tabbar = document.getElementById('tabbar');
    const newTabBtn = document.getElementById('new-tab-btn');
    const urlbar = document.getElementById('urlbar');
    const urlbarContainer = document.getElementById('urlbar-container');
    const urlbarIcon = document.getElementById('urlbar-icon');

    let currentTabs = [];
    let currentActiveId = null;

    function formatTabTitle(tab) {
      if (tab.title && !tab.title.startsWith('Tab ')) return tab.title;
      try {
        const urlObj = new URL(tab.url);
        return urlObj.hostname.replace(/^www\./, '') || tab.url;
      } catch (e) {
        return tab.url || 'Google';
      }
    }

    function renderTabs() {
      const existingTabs = tabbar.querySelectorAll('.tab');
      existingTabs.forEach(t => t.remove());

      currentTabs.forEach(tab => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === currentActiveId ? 'active' : ''}`;
        
        const titleEl = document.createElement('span');
        titleEl.className = 'tab-title';
        titleEl.textContent = formatTabTitle(tab);

        const closeEl = document.createElement('span');
        closeEl.className = 'tab-close';
        closeEl.textContent = '×';
        closeEl.title = 'Close Tab';

        closeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          invoke('close_tab', { tabId: tab.id }).catch(console.error);
        });

        tabEl.addEventListener('click', () => {
          if (tab.id !== currentActiveId) {
            invoke('switch_tab', { tabId: tab.id }).catch(console.error);
          }
        });

        tabbar.insertBefore(tabEl, newTabBtn);
      });
    }

    function handleNavigate() {
      const input = urlbar.value.trim();
      if (!input) return;

      urlbarContainer.classList.add('loading');
      invoke('navigate', { url: input }).catch((err) => {
        console.error('Navigate error:', err);
        urlbarContainer.classList.remove('loading');
      });
    }

    urlbar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleNavigate();
    });

    urlbar.addEventListener('focus', () => urlbar.select());

    document.getElementById('back').addEventListener('click', () => {
      invoke('go_back').catch(() => {});
    });

    document.getElementById('forward').addEventListener('click', () => {
      invoke('go_forward').catch(() => {});
    });

    document.getElementById('refresh').addEventListener('click', () => {
      invoke('reload').catch(() => {});
    });

    newTabBtn.addEventListener('click', () => {
      invoke('create_tab', { url: 'https://www.google.com' }).catch(console.error);
    });

    listen('tabs-changed', (event) => {
      currentTabs = event.payload.tabs || [];
      currentActiveId = event.payload.active_id || null;
      renderTabs();
    });

    listen('url-changed', (event) => {
      urlbar.value = event.payload;
      urlbarContainer.classList.remove('loading');

      if (event.payload.startsWith('https://')) {
        urlbarIcon.textContent = '🔒';
        urlbarIcon.style.color = '#757598';
      } else if (event.payload.startsWith('http://')) {
        urlbarIcon.textContent = '⚠️';
        urlbarIcon.style.color = '#e0a030';
      } else {
        urlbarIcon.textContent = '🔍';
        urlbarIcon.style.color = '#757598';
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        invoke('create_tab', { url: 'https://www.google.com' }).catch(console.error);
      } else if (e.ctrlKey && e.key.toLowerCase() === 'w') {
        e.preventDefault();
        if (currentActiveId) {
          invoke('close_tab', { tabId: currentActiveId }).catch(console.error);
        }
      } else if (e.ctrlKey && e.key === 'Tab') {
        e.preventDefault();
        if (currentTabs.length > 1) {
          const idx = currentTabs.findIndex(t => t.id === currentActiveId);
          const nextIdx = e.shiftKey
            ? (idx - 1 + currentTabs.length) % currentTabs.length
            : (idx + 1) % currentTabs.length;
          invoke('switch_tab', { tabId: currentTabs[nextIdx].id }).catch(console.error);
        }
      }
    });
  </script>
</body>
</html>
