<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghost</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #08080e;
      color: #39ff14;
      font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Code', 'Fira Code', Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .terminal-prompt {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-symbol {
      color: #7878a0;
    }

    .command {
      color: #39ff14;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: #39ff14;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="terminal-prompt">
    <span class="prompt-symbol">ghost ~ %</span>
    <span class="command">ghost</span><span class="cursor"></span>
  </div>
</body>
</html>
