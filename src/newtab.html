<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghost</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #0d0d14;
      color: #e0e0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .wordmark {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      color: #c5a059;
      margin: 0 0 0 0.35em;
      text-transform: uppercase;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1 class="wordmark">Ghost</h1>
</body>
</html>
