<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghost</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #0b0b12;
      color: #f0f0fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    /* Ambient atmospheric background glow */
    .bg-aura {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.07) 0%, rgba(130, 130, 255, 0.04) 45%, rgba(11, 11, 18, 0) 75%);
      pointer-events: none;
      border-radius: 50%;
    }

    .wordmark {
      font-size: 4.5rem;
      font-weight: 600;
      letter-spacing: 0.55em;
      color: #f0f0fa;
      margin: 0 0 0 0.55em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(197, 160, 89, 0.1);
    }
  </style>
</head>
<body>
  <div class="bg-aura"></div>
  <h1 class="wordmark">Ghost</h1>
</body>
</html>
