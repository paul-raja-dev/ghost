<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghost Shell</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #08080e;
      color: #39ff14;
      font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Code', 'Fira Code', Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .terminal-prompt {
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 620px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(57, 255, 20, 0.22);
      border-radius: 8px;
      padding: 14px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(57, 255, 20, 0.08);
      cursor: text;
    }

    .prompt-symbol {
      color: #7878a0;
      flex-shrink: 0;
      font-weight: 600;
    }

    #cli-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #39ff14;
      font-family: inherit;
      font-size: 1.3rem;
      outline: none;
      caret-color: #39ff14;
      min-width: 0;
      user-select: text;
      -webkit-user-select: text;
    }

    #cli-input::placeholder {
      color: #2a4034;
    }
  </style>
</head>
<body>
  <div class="terminal-prompt" id="prompt-box">
    <span class="prompt-symbol">ghost >></span>
    <input id="cli-input" type="text" autofocus autocomplete="off" spellcheck="false" placeholder="type URL or search..." />
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const cliInput = document.getElementById('cli-input');
    const promptBox = document.getElementById('prompt-box');

    function focusInput() {
      cliInput.focus();
    }

    // Ensure focus immediately
    window.addEventListener('DOMContentLoaded', focusInput);
    window.addEventListener('load', focusInput);
    setTimeout(focusInput, 50);

    promptBox.addEventListener('click', focusInput);
    document.body.addEventListener('click', focusInput);

    cliInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = cliInput.value.trim();
        if (query) {
          invoke('navigate', { url: query }).catch(console.error);
        }
      }
    });
  </script>
</body>
</html>
