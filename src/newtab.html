<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ghost Shell</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #0e0e14;
      color: #e0e0eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 0.4em;
      color: #f5f5fc;
      margin: 0 0 0.5rem 0.4em;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      color: #c5a059;
      text-transform: uppercase;
      font-weight: 400;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Ghost</h1>
    <div class="subtitle">Minimal Shell Architecture</div>
  </div>
</body>
</html>
